{% for component in xmpp_components %}{% if component.enabled %}
  -
    port: {{ component.port }}
    ip: "{{ component.ip }}"
    module: ejabberd_service
{% if component.privileged %}
    check_from: false
{% endif %}
    hosts:
      "{{ component.host }}":
        password: "{{ component.password }}"
{% endif %}{% endfor %}
