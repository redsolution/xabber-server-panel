{% for component in xmpp_components %}{% if component.enabled %}
  -
    port: {{ component.port }}
    ip: "{{ component.ip }}"
    module: ejabberd_service
{% if component.tls %}    tls: true
    certfile: "{{ settings.CERTS_DIR }}/server.pem"
{% endif %}    hosts:
      "{{ component.jid }}":
        password: "{{ component.password }}"
{% endif %}{% endfor %}
